<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` because the one thing on this page is a full-bleed 3D dojo: letterboxing
      it into the safe area to dodge a notch would put black bars around a render. Taking the whole
      screen is only safe because every overlay B8 mounts pads itself with `env(safe-area-inset-*)`
      — the canvas goes under the notch and the home indicator, the CONTROLS never do.
      No `maximum-scale` / `user-scalable=no`: pinch-zoom is an accessibility control and disabling
      it to stop an accidental double-tap zoom is the wrong trade. The controls handle that
      themselves with `touch-action: manipulation`, which drops the double-tap delay without
      disabling the gesture anywhere else.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Kata 3D — Shotokan kata viewer</title>
    <style>
      /*
        B6 PLAYER owns index.html (docs/OWNERSHIP.md). This stylesheet is deliberately LAYOUT ONLY:
        `src/ui/theme.css` is B8's file and every visual style for the timeline, labels, HUD and
        lil-gui belongs there. What lives here is the canvas geometry, the overlay roots B8 mounts
        into, and a boot banner — because a black canvas and a failed boot look identical, and the
        one thing this page must never do is fail silently.
      */
      :root {
        --kata-bg: #0b0c0e;
        --kata-fg: #cbd2d9;
        --kata-dim: #7c8894;
        --kata-accent: #7dd3a0;
        --kata-error: #ff6b6b;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--kata-bg);
        color: var(--kata-fg);
        font: 13px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        /*
          `overflow: hidden` stops the page SCROLLING; it does nothing about the overscroll gesture
          itself. On a phone, a downward drag that starts anywhere the canvas has not claimed still
          triggers pull-to-refresh in Chrome and the rubber-band bounce in Safari — the first
          RELOADS the page mid-kata, taking the compile with it. `overscroll-behavior: none` is what
          actually cancels both.

          `text-size-adjust` stops iOS inflating the font when a phone is turned to landscape. The
          HUD reserves widths in px for tabular numbers, so an engine silently scaling text up
          re-wraps the count list and clips the transport's clock.
        */
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      #kata-stage {
        position: fixed;
        inset: 0;
      }

      /*
        `touch-action: none` is not cosmetic: without it a touch drag scrolls the page instead of
        reaching OrbitControls, and the 360-degree orbit this product is built around does not work
        on any tablet. `display: block` kills the inline-element baseline gap that otherwise makes
        the canvas 4-5 px taller than its box and drives a ResizeObserver feedback loop.
      */
      #kata-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }

      /*
        Overlay roots. B8 (src/ui/**) mounts the timeline, labels and HUD into these.

        `z-index: 1` puts every mounted panel above `#kata-hint`, which is later in the DOM and
        therefore painted over them by default. That was invisible while the hint was a 16 px line in
        the bottom-left corner and nothing ever reached it; on a compact viewport the hint spans the
        full width just above the transport, and in landscape it ran straight through the camera
        popover and the count list's footer. The hint is the lowest-priority chrome on the page — it
        repeats what the count list already says — so it is the thing that goes underneath.
        `#boot-status` keeps its own `z-index: 10` and stays above everything, which is correct: a
        failed boot must never be hidden behind a control panel.
      */
      #ui-root,
      #hud-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
      #ui-root > *,
      #hud-root > * {
        pointer-events: auto;
      }

      #boot-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 6vh 6vw;
        background: var(--kata-bg);
        text-align: center;
        z-index: 10;
      }
      #boot-status[hidden] {
        display: none;
      }
      #boot-status .msg {
        max-width: 70ch;
        white-space: pre-wrap;
        text-align: left;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--kata-dim);
      }
      #boot-status.failed .msg {
        color: var(--kata-error);
      }
      #boot-status h1 {
        margin: 0 0 0.75rem;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--kata-accent);
      }
      #boot-status.failed h1 {
        color: var(--kata-error);
      }

      #kata-hint {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: var(--kata-dim);
        font-size: 11px;
        letter-spacing: 0.02em;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
      }
      #kata-hint b {
        color: var(--kata-fg);
        font-weight: 600;
      }
      #kata-hint[hidden] {
        display: none;
      }

      /*
        COMPACT — the same breakpoint `src/ui/layout.ts` compiles into every widget's stylesheet.
        The two numbers below ARE `COMPACT_MAX_WIDTH_PX` and `COMPACT_MAX_HEIGHT_PX`; a plain
        stylesheet in a plain HTML file cannot import them, so this is the one copy in the codebase
        and it has to be changed with them. Everything else derives its query from the module.

        `#kata-hint` is not decoration by the time this matters: `src/main.ts` overwrites it with the
        CURRENT COUNT's name on every beat. On a phone the transport strip goes full-bleed along the
        bottom edge, straight through where the hint used to sit, so the hint moves ABOVE it, spans
        the width, and centres — which is also where a viewer's eye already is, on the strip. 88 px
        clears a 44 px control row plus the strip's padding and its 8 px offset.
      */
      @media (max-width: 900px), (max-height: 560px) {
        #kata-hint {
          left: 8px;
          right: 8px;
          bottom: calc(88px + env(safe-area-inset-bottom));
          text-align: center;
          font-size: 12px;
          /* One line, always. A wrapped three-line hint on a 375 px screen covers the karateka's
             head, and the text it wraps is a technique name that is readable truncated. */
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }
    </style>
  </head>
  <body>
    <div id="kata-stage">
      <!-- The one and only canvas. src/player/app.ts hands it to createRenderer (§5.1). -->
      <canvas id="kata-canvas" tabindex="0"></canvas>
    </div>

    <!-- Mount points for B8's timeline / labels / HUD. Intentionally empty in Phase 1. -->
    <div id="ui-root"></div>
    <div id="hud-root"></div>

    <div id="boot-status">
      <div>
        <h1>Kata 3D</h1>
        <div class="msg">booting the dojo…</div>
      </div>
    </div>

    <!--
      Touch first, keys second, and in that order on purpose: the keyboard half of this line was for
      years the ONLY documentation of controls that had no on-screen equivalent at all. They have one
      now (the `cam` button, top-left), so the shortcuts are what they should always have been — an
      accelerator for the people who have a keyboard, named after a control you can also see.
    -->
    <div id="kata-hint" hidden>
      drag to orbit · pinch to zoom · <b>cam</b> (top-left) for viewpoints and follow-cam ·
      keys: <b>1-9</b> presets · <b>0</b> overhead · <b>m</b> measurement · <b>r</b> reset ·
      <b>f</b> follow
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
